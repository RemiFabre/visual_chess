<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visual Chess</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="wrap">
    <header class="site-header">
      <h1>Visual Chess</h1>
      <p>A playable board with toggle-able overlays. Pick up any piece to see legal moves. Pick up a knight to see its L-pattern reach as you drag.</p>
    </header>

    <div class="layout">
      <div class="board-area" id="board-area"></div>

      <aside class="sidebar">
        <div class="card">
          <h2>Overlays</h2>
          <div class="overlay-toggles">
            <button class="overlay-toggle" data-overlay="pressure">Pressure</button>
            <button class="overlay-toggle" data-overlay="sight">Sight</button>
            <button class="overlay-toggle" data-overlay="guards">Guards</button>
          </div>
          <div class="legend" id="status">White to move.</div>
        </div>

        <div class="card">
          <h2>Game</h2>
          <div class="controls">
            <button id="new-game">New game</button>
            <button id="undo">Undo</button>
            <button id="flip">Flip board</button>
          </div>
        </div>

        <div class="card">
          <h2>Position</h2>
          <div class="position-list" id="position-list"></div>
        </div>

        <div class="card">
          <h2>FEN</h2>
          <input type="text" class="fen-input" id="fen-input" />
        </div>

        <div class="card">
          <h2>Moves</h2>
          <div class="move-list" id="move-list"></div>
        </div>
      </aside>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
